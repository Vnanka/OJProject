version: 2

# -----------------------------------------------------------------------------
# schema.yml — descriptions and tests for the gold star schema.
#
# Gold tests are ERRORS: gold is what Power BI reads, so a broken key or a
# fact row pointing at nothing must stop the build. Known source problems were
# already reported (as warnings) in silver and are mapped to -1 "Unknown" here.
# -----------------------------------------------------------------------------

models:

  - name: dim_Date
    description: "Calendar, 1 Apr 2022 - 31 Mar 2028, plus the -1 Unknown row. Fiscal year starts 1 April; ISO weeks; England & Wales bank holidays."
    columns:
      - name: datekey
        description: "yyyymmdd as an integer, e.g. 20260921. -1 = unknown date."
        data_tests: [unique, not_null]
      - name: "Fiscal Year"
        quote: true
        data_tests: [not_null]

  - name: dim_Office
    description: "Offices, from the office reference list. Generated OfficeKey; -1 = Unknown."
    columns:
      - name: officekey
        data_tests: [unique, not_null]
      - name: "Office Name"
        quote: true
        data_tests: [unique, not_null]

  - name: dim_Industry
    description: "Client industry hierarchy (Industry -> SubSector), from the CRM dropdown. Key = SubSectorId; -1 = Unknown."
    columns:
      - name: industrykey
        data_tests: [unique, not_null]

  - name: dim_Discipline
    description: "Job disciplines, from the CRM dropdown. Key = DisciplineId; -1 = Unknown (blank in the CRM)."
    columns:
      - name: disciplinekey
        data_tests: [unique, not_null]

  - name: dim_Consultant
    description: "Consultants and team managers, current team/office. Key = UserId; -1 = Unknown."
    columns:
      - name: consultantkey
        data_tests: [unique, not_null]
      - name: Email
        data_tests: [unique]
      - name: Team
        data_tests: [not_null]

  - name: dim_Client
    description: "Clients. Key = CompanyId; -1 = Unknown. Industry text is for convenience; facts carry IndustryKey."
    columns:
      - name: clientkey
        data_tests: [unique, not_null]

  - name: dim_Vacancy
    description: "Vacancies. Key = JobOrderId; -1 = Unknown. Salary in local currency. Facts carry DisciplineKey."
    columns:
      - name: vacancykey
        data_tests: [unique, not_null]
      - name: "Salary Currency"
        quote: true
        description: "Every real vacancy's office must have a currency."
        data_tests:
          - not_null:
              config:
                where: "VacancyKey <> -1"

  - name: fact_Application
    description: "One row per application (candidate x vacancy): milestone date keys, reached flags, current stage, days to each stage. Active date = SubmittedDateKey (cohort). Milestone dates are blank when the stage was never reached; -1 = genuinely unknown."
    columns:
      - name: applicationid
        data_tests: [unique, not_null]
      - name: vacancykey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Vacancy'), field: vacancykey}
      - name: clientkey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Client'), field: clientkey}
      - name: industrykey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Industry'), field: industrykey}
      - name: disciplinekey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Discipline'), field: disciplinekey}
      - name: consultantkey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Consultant'), field: consultantkey}
      - name: officekey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Office'), field: officekey}
      - name: currentstagekey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Stage'), field: stagekey}
      - name: submitteddatekey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Date'), field: datekey}
      - name: interviewdatekey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Date'), field: datekey}
      - name: offerdatekey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Date'), field: datekey}
      - name: placeddatekey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Date'), field: datekey}
      - name: exitdatekey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Date'), field: datekey}

  - name: fact_ApplicationLine
    description: "One row per status change (the event log) - the 'line' to fact_Application's 'header'. Active date = EventDateKey (activity view). dim_Stage plays two roles: StatusToKey active, StatusFromKey inactive. No relationship to fact_Application; ApplicationId is a plain column."
    columns:
      - name: applicationlineid
        description: "The CRM's own status history id."
        data_tests: [unique, not_null]
      - name: applicationid
        description: "Every line must belong to an application in the header fact."
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('fact_Application'), field: applicationid}
      - name: vacancykey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Vacancy'), field: vacancykey}
      - name: clientkey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Client'), field: clientkey}
      - name: industrykey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Industry'), field: industrykey}
      - name: disciplinekey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Discipline'), field: disciplinekey}
      - name: consultantkey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Consultant'), field: consultantkey}
      - name: officekey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Office'), field: officekey}
      - name: statustokey
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_Stage'), field: stagekey}
      - name: statusfromkey
        description: "0 'No Status' on the first event of an application."
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_Stage'), field: stagekey}
      - name: eventdatekey
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_Date'), field: datekey}

  - name: fact_Placement
    description: "One row per placement, from finance. Booked fee = salary x fee %, local and GBP (monthly rate of the placed month). Fee % exactly as recorded (3 known gaps are reported, not patched). Start/Leave dates blank when they haven't happened."
    columns:
      - name: "Placement Ref"
        quote: true
        data_tests: [unique, not_null]
      - name: applicationid
        description: "Every placement must exist as an application in the CRM - proves CRM and finance line up."
        data_tests:
          - relationships:
              arguments: {to: ref('fact_Application'), field: applicationid}
      - name: vacancykey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Vacancy'), field: vacancykey}
      - name: clientkey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Client'), field: clientkey}
      - name: industrykey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Industry'), field: industrykey}
      - name: disciplinekey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Discipline'), field: disciplinekey}
      - name: consultantkey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Consultant'), field: consultantkey}
      - name: officekey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Office'), field: officekey}
      - name: placeddatekey
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_Date'), field: datekey}
      - name: startdatekey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Date'), field: datekey}
      - name: leavedatekey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Date'), field: datekey}
      - name: salarygbp
        description: "Every placement must find an exchange rate, or its GBP values would silently be blank."
        data_tests: [not_null]

  - name: fact_FeeTransaction
    description: "The money: one row per invoice or credit note. SUM(NetAmountGbp) = NFI. DocumentDateKey (active) = ledger view; OriginalInvoiceDateKey (inactive) = attributed view. Orphan documents kept with -1 keys so totals match the ledger."
    columns:
      - name: "Document No"
        quote: true
        data_tests: [unique, not_null]
      - name: "Document Type"
        quote: true
        data_tests:
          - accepted_values:
              arguments:
                values: ['INV', 'CRN']
      - name: vacancykey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Vacancy'), field: vacancykey}
      - name: clientkey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Client'), field: clientkey}
      - name: industrykey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Industry'), field: industrykey}
      - name: disciplinekey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Discipline'), field: disciplinekey}
      - name: consultantkey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Consultant'), field: consultantkey}
      - name: officekey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Office'), field: officekey}
      - name: documentdatekey
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_Date'), field: datekey}
      - name: originalinvoicedatekey
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_Date'), field: datekey}
      - name: netamountgbp
        description: "Every document must find an exchange rate, or it would silently drop out of NFI."
        data_tests: [not_null]

  - name: fact_Target
    description: "Monthly NFI target per consultant, GBP. Month grain: DateKey = 1st of the month. Only consultant, office and date apply - no client/industry/discipline/vacancy by design."
    columns:
      - name: consultantkey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Consultant'), field: consultantkey}
      - name: officekey
        data_tests:
          - relationships:
              arguments: {to: ref('dim_Office'), field: officekey}
      - name: datekey
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_Date'), field: datekey}
      - name: targetnfigbp
        data_tests: [not_null]

  - name: sec_UserTeam
    description: "Row-level security access list: one row per email per team they may see. No relationship in Power BI; used by the dynamic RLS role filtering dim_Consultant[Team]. CEO and CFO also see team 'Unknown'."
    columns:
      - name: Email
        description: "Team managers must be real CRM users, so RLS works for them by their own email."
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_Consultant'), field: Email}
              config:
                where: "\"Role Description\" like 'Team Manager%'"
      - name: Team
        description: "Every team in the list must exist in dim_Consultant (incl. 'Unknown')."
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_Consultant'), field: Team}
      - name: "Role Description"
        quote: true
        data_tests: [not_null]

  - name: dim_FxRateMonthly
    description: "Monthly average ECB rate per currency (units per 1 GBP), plus GBP = 1.0. Used to convert every amount to GBP: local / RatePerGbp."
    columns:
      - name: RatePerGbp
        data_tests: [not_null]

  - name: dim_Stage
    description: "Pipeline stages: the CRM status codes mapped to the business funnel. Key = status code; -1 = Unknown exit."
    columns:
      - name: stagekey
        data_tests: [unique, not_null]
      - name: "Funnel Stage"
        quote: true
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CV Sent', 'Interview', 'Offer', 'Placed', 'Rejected', 'Withdrawn', 'Not started', 'Pre-funnel', 'Unknown exit']
